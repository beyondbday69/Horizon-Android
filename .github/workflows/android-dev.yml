name: Android dev APKs
run-name: Android dev · ${{ github.sha }}

on:
  push:
    branches: [android, controls-overhaul-zip, camera-overhaul, barrel-roll]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - 'packaging/android/**'
      - 'tools/**'
      - 'mods/**'
      - 'third_party/**'
      - '.github/workflows/android-dev.yml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      all_abis:
        description: Also build ARMv7, x86 and x86_64
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Never expose a signing secret to pull requests or arbitrary dispatch refs.
    if: github.ref == 'refs/heads/android' || github.ref == 'refs/heads/controls-overhaul-zip' || github.ref == 'refs/heads/camera-overhaul' || github.ref == 'refs/heads/barrel-roll'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.all_abis && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Restore the CI signing identity
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          # A dedicated dev key wins when the repository has one; otherwise the release
          # key signs dev builds too (the .dev package is a separate app, so the
          # certificate is the only thing the APK carries -- never the key itself).
          dev = os.environ.get('DEV_KEYSTORE', '')
          release = os.environ.get('RELEASE_KEYSTORE', '')
          if dev:
              value, password, alias = dev, 'android', 'androiddebugkey'
          elif release:
              value = release
              password = os.environ['RELEASE_KEYSTORE_PASSWORD']
              alias = os.environ['RELEASE_KEY_ALIAS']
          else:
              # No secret: still build, but make it impossible to miss that this APK
              # carries a throwaway debug key and cannot update an installed build.
              marker = 'NO-STABLE-KEY'
              print(f'::warning title={marker}::No ANDROID_KEYSTORE_BASE64 (or '
                    'ANDROID_DEV_KEYSTORE_BASE64) secret is set, so this APK is signed with a '
                    'throwaway debug key and CANNOT update an already installed build. Run the '
                    'generate-signing-key workflow and set the secrets (docs/android-signing.md).')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'## :warning: {marker}\n\nNo signing secret is set, so this APK '
                                'is signed with a throwaway debug key and **cannot update an '
                                'installed build**. Run **Actions > generate-signing-key**, then '
                                'set the repository secrets (`docs/android-signing.md`).\n')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write('HORIZON_STABLE_KEY=0\n')
              raise SystemExit(0)
          path = Path('.local/android/ci.keystore')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          # Gradle resolves a relative storeFile against packaging/android, so pass an
          # absolute path and the credentials that belong to this keystore.
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'HORIZON_ANDROID_KEYSTORE={path.resolve()}\n')
              env.write(f'HORIZON_ANDROID_KEYSTORE_PASSWORD={password}\n')
              env.write(f'HORIZON_ANDROID_KEY_ALIAS={alias}\n')
              env.write(f'HORIZON_ANDROID_KEY_PASSWORD={password}\n')
              env.write('HORIZON_STABLE_KEY=1\n')
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Install Android toolchain
        env:
          ABI: ${{ matrix.abi }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            android-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Test the bundled Camera Overhaul and Barrel Roll crates
        run: |
          cargo test -p camera-overhaul-core
          cargo test -p barrel-roll-core
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build optimized public dev APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          # versionCode is 1000 + the run number (below), so every dev APK outranks the last.
          python3 tools/android_build.py --abi "$ABI" --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "${JAVA_HOME_17_X64:-$JAVA_HOME}" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Collect only audited APK and public metadata
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path('dist')
          out.mkdir()
          sha, abi = os.environ['GITHUB_SHA'], os.environ['ABI']
          stable = os.environ.get('HORIZON_STABLE_KEY') == '1'
          suffix = '' if stable else '-NO-STABLE-KEY'
          name = f'Horizon-Android-dev.{os.environ["GITHUB_RUN_NUMBER"]}.{sha[:12]}-{abi}{suffix}.apk'
          apk = out / name
          shutil.copyfile(Path('.local/android/apk') / abi / 'horizon-android-public.apk', apk)
          (out / 'SHA256SUMS.txt').write_text(f'{hashlib.sha256(apk.read_bytes()).hexdigest()}  {name}\n')
          for source, dest in [('LICENSE', 'LICENSE.txt'), ('THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.md')]:
              shutil.copyfile(source, out / dest)
          # The importable Camera Overhaul bundle (Options > Mods > Import).
          shutil.copyfile('camera_overhaul.hnmod', out / 'camera_overhaul.hnmod')
          # The importable Do a Barrel Roll bundle (Options > Mods > Import).
          shutil.copyfile('barrel_roll.hnmod', out / 'barrel_roll.hnmod')
          (out / 'BUILD.json').write_text(json.dumps({'commit': sha, 'abi': abi, 'profile': 'release',
              'package': 'dev.horizon.android.dev', 'experimental': True,
              'run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'HORIZON_APK_SUFFIX={suffix}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Dev APK: {abi}\n\nCommit: `{sha}`. Optimized release profile; experimental build.\n\n'
                  'Download the APK artifact below. Installs separately from the stable app. '
                  'Existing worlds/accounts are not copied automatically.\n')
              if not stable:
                  summary.write('\n:warning: **NO-STABLE-KEY**: no signing secret was set, so this APK '
                                'is signed with a throwaway key and cannot update an installed build.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-dev-${{ github.run_number }}-${{ matrix.abi }}${{ env.HORIZON_APK_SUFFIX }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f .local/android/ci.keystore .local/android/debug.keystore
