# Spike: prove a native mod runs without editing Horizon's own source.
#
# It builds the game with native-mods/hello compiled in (packaging/android/native_build.sh
# applies the mod's horizon-mixins bundle to the source, then cargo-ndk builds the library and
# the APK), and uploads the result. Install the APK, enter a world, and the mod's line appears
# in chat. The mod is one folder: a mixin manifest and one helper file.
name: native-mod-spike

on:
  push:
    branches: [native-mod-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '3'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked
      # As the native build does: the fast profile needs more memory than the runner has.
      - name: Make room for the build
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
      - name: Build the game with the hello mod compiled in
        run: |
          bash packaging/android/native_build.sh "$PWD" out native-mods/hello/mixins/hello
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-mod-spike-hello
          path: out/
          if-no-files-found: error
          retention-days: 7
